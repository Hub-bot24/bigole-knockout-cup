<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a1210" />
  <title>BIGOLE Knockout Cup</title>
  <link rel="stylesheet" href="styles.css?v=pyramid-1" />
</head>
<body>
  <main id="viewport">
    <section id="stage" aria-label="BIGOLE Knockout Cup finals bracket">
      <svg id="bracket" viewBox="0 0 1240 900" role="img" aria-labelledby="title desc">
        <title id="title">BIGOLE Knockout Cup Top 8 Finals Series</title>
        <desc id="desc">Top four qualifying winners skip week two. Qualifying losers play elimination winners in week two. Semi final winners cross over to the opposite preliminary final.</desc>
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#35413f"/><stop offset="1" stop-color="#26312f"/></linearGradient>
          <linearGradient id="card" x1="0" x2="1"><stop offset="0" stop-color="#72803f"/><stop offset="1" stop-color="#89964e"/></linearGradient>
        </defs>

        <rect class="bg" x="0" y="0" width="1240" height="900" rx="4" />

        <!-- Banner header -->
        <rect class="banner" x="40" y="14" width="1160" height="52" rx="4" />
        <text class="kicker" x="64" y="47">BIGOLE KNOCKOUT CUP · FINALS SERIES</text>
        <circle class="status-dot" cx="1176" cy="40" r="9" />
        <text class="meta" id="meta" x="1240" y="88" text-anchor="end">ROUND 19 · LADDER</text>

        <!-- Routes -->
        <g class="routes">
          <!-- Group A (1v4, Qualifying Final 1) -->
          <path class="winner" d="M 170 650 V 330 H 226" />
          <path class="loser"  d="M 170 650 V 480 H 226" />
          <!-- Group B (5v8, Elimination Final 1) -->
          <path class="winner" d="M 470 650 V 503 H 414" />
          <!-- Group C (6v7, Elimination Final 2) -->
          <path class="winner" d="M 770 650 V 480 H 826" />
          <!-- Group D (2v3, Qualifying Final 2) -->
          <path class="winner" d="M 1070 650 V 353 H 1014" />
          <path class="loser"  d="M 1070 650 V 503 H 1014" />

          <!-- Semi 1 winner crosses to Preliminary Final 2 -->
          <path class="crossover" d="M 320 440 L 826 330" />
          <!-- Semi 2 winner crosses to Preliminary Final 1 -->
          <path class="crossover" d="M 920 440 L 414 353" />

          <!-- Preliminary Final winners to Grand Final -->
          <path d="M 320 290 V 180 H 526" />
          <path d="M 920 290 V 203 H 714" />
          <!-- Champion -->
          <path d="M 620 140 V 100" />
        </g>

        <!-- Winner/loser labels -->
        <g class="route-labels">
          <text x="180" y="328">WINNER</text>
          <text x="180" y="478">LOSER</text>
          <text x="1060" y="351" text-anchor="end">WINNER</text>
          <text x="1060" y="501" text-anchor="end">LOSER</text>
        </g>

        <!-- Junctions -->
        <g class="junctions">
          <circle cx="170" cy="330" r="7"/><circle cx="170" cy="480" r="7"/>
          <circle cx="470" cy="503" r="7"/><circle cx="770" cy="480" r="7"/>
          <circle cx="1070" cy="353" r="7"/><circle cx="1070" cy="503" r="7"/>
          <circle cx="320" cy="290" r="7"/><circle cx="920" cy="290" r="7"/>
          <circle cx="620" cy="100" r="9" class="champion"/>
        </g>

        <!-- First round pairs -->
        <g id="week1"></g>

        <!-- Match boxes -->
        <g id="laterMatches">
          <g class="match" transform="translate(226 440)" data-match="sf1"><rect width="188" height="78" rx="5"/><text class="match-title" x="12" y="19">SEMI FINAL 1</text><g class="slot" transform="translate(10 30)"><rect width="168" height="20" rx="3"/><text class="slot-team" x="30" y="14">TBD</text><text class="slot-score" x="158" y="14" text-anchor="end">—</text></g><g class="slot" transform="translate(10 53)"><rect width="168" height="20" rx="3"/><text class="slot-team" x="30" y="14">TBD</text><text class="slot-score" x="158" y="14" text-anchor="end">—</text></g></g>
          <g class="match" transform="translate(826 440)" data-match="sf2"><rect width="188" height="78" rx="5"/><text class="match-title" x="12" y="19">SEMI FINAL 2</text><g class="slot" transform="translate(10 30)"><rect width="168" height="20" rx="3"/><text class="slot-team" x="30" y="14">TBD</text><text class="slot-score" x="158" y="14" text-anchor="end">—</text></g><g class="slot" transform="translate(10 53)"><rect width="168" height="20" rx="3"/><text class="slot-team" x="30" y="14">TBD</text><text class="slot-score" x="158" y="14" text-anchor="end">—</text></g></g>
          <g class="match" transform="translate(226 290)" data-match="pf1"><rect width="188" height="78" rx="5"/><text class="match-title" x="12" y="19">PRELIMINARY FINAL 1</text><g class="slot" transform="translate(10 30)"><rect width="168" height="20" rx="3"/><text class="slot-team" x="30" y="14">TBD</text><text class="slot-score" x="158" y="14" text-anchor="end">—</text></g><g class="slot" transform="translate(10 53)"><rect width="168" height="20" rx="3"/><text class="slot-team" x="30" y="14">TBD</text><text class="slot-score" x="158" y="14" text-anchor="end">—</text></g></g>
          <g class="match" transform="translate(826 290)" data-match="pf2"><rect width="188" height="78" rx="5"/><text class="match-title" x="12" y="19">PRELIMINARY FINAL 2</text><g class="slot" transform="translate(10 30)"><rect width="168" height="20" rx="3"/><text class="slot-team" x="30" y="14">TBD</text><text class="slot-score" x="158" y="14" text-anchor="end">—</text></g><g class="slot" transform="translate(10 53)"><rect width="168" height="20" rx="3"/><text class="slot-team" x="30" y="14">TBD</text><text class="slot-score" x="158" y="14" text-anchor="end">—</text></g></g>
          <g class="match grand" transform="translate(526 140)" data-match="gf"><rect width="188" height="78" rx="5"/><text class="match-title" x="12" y="19">GRAND FINAL</text><g class="slot" transform="translate(10 30)"><rect width="168" height="20" rx="3"/><text class="slot-team" x="30" y="14">TBD</text><text class="slot-score" x="158" y="14" text-anchor="end">—</text></g><g class="slot" transform="translate(10 53)"><rect width="168" height="20" rx="3"/><text class="slot-team" x="30" y="14">TBD</text><text class="slot-score" x="158" y="14" text-anchor="end">—</text></g></g>
        </g>

        <g class="legend" transform="translate(40 800)">
          <text>TOP 4 WIN → SKIP SEMI</text><text x="260">TOP 4 LOSE → SEMI</text><text x="500">5–8 LOSE → OUT</text><text x="700">SEMI WINNERS CROSS OVER</text>
          <text id="updated" x="1160" text-anchor="end">MANUAL SNAPSHOT</text>
        </g>
      </svg>
    </section>
  </main>
  <script src="app.js?v=pyramid-1"></script>
</body>
</html>
